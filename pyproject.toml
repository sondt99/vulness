[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "s-ness"
version = "0.1.0"
description = "Autonomous vulnerability-discovery harness: Claude Code hunts, GLM validates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "rich>=13.7",
    "PyYAML>=6.0",
    "tenacity>=8.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
sness = "sness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sness*"]

[tool.setuptools.package-data]
sness = ["state/*.sql", "prompts/*.md", "findings/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer's entire API is function calls in argument defaults; B008 cannot apply here.
"sness/cli.py" = ["B008"]

[tool.pyright]
include = ["sness"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = "warning"
